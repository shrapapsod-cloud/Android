name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Debug keystore (один и тот же — новые APK ставятся поверх)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease
      - name: Collect
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/ios-home-release.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ios-home-apk-${{ github.run_number }}
          path: out/ios-home-release.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" out/ios-home-release.apk \
            --title "iOS Home build ${{ github.run_number }}" --notes "Release APK" --target "${{ github.sha }}"
